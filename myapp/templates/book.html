{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Books</title>
    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>
<body>
    <main class="container">
        <nav>
            <a href="{% url 'author_author' %}">Authors</a>
            <a class="active" href="{% url 'book_book' %}">Books</a>
        </nav>

        <div class="top">
            <h1>Books</h1>
            <a class="button" href="{% url 'creat_book' %}">Create book</a>
        </div>

        <form class="search" method="get">
            <input type="text" name="search" value="{{ search }}" placeholder="Search book or author...">
            <button type="submit">Search</button>
            {% if search %}
                <a href="{% url 'book_book' %}">Clear</a>
            {% endif %}
        </form>

        <div class="list">
            {% for bok in book %}
                <div class="card">
                    <div>
                        <h2>{{ bok.title }}</h2>
                        <p>Author: {{ bok.author }}</p>
                        <p>{{ bok.pages }} pages · ${{ bok.price }}</p>
                        <p>{{ bok.description }}</p>
                    </div>
                    <div class="actions">
                        <a href="{% url 'update' bok.id %}">Update</a>
                        <a class="danger" href="{% url 'delete' bok.id %}">Delete</a>
                    </div>
                </div>
            {% empty %}
                <p class="empty">Book not found.</p>
            {% endfor %}
        </div>
    </main>
</body>
</html>
